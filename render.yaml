services:
  - type: web
    name: rea-workbench
    runtime: node
    plan: free
    rootDir: workbench
    buildCommand: npm install --omit=dev --package-lock=false
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: NODE_ENV
        value: production
      - key: WORKBENCH_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
